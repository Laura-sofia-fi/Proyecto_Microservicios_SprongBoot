<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>{{ option_a }} vs {{ option_b }}!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="docker-compose, docker, voting app, python">
    <meta name="author" content="Equipo Santa Cruz">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/style.css') }}">
  </head>
  <body>
    <div id="content-container">
      <div id="content-container-center">
        <h3>{{ option_a }} vs {{ option_b }}!</h3>

        <form id="choice" name="form" method="POST" action="/">
          <button id="a" type="submit" name="vote" class="a" value="a">{{ option_a }}</button>
          <button id="b" type="submit" name="vote" class="b" value="b">{{ option_b }}</button>
        </form>

        <div id="tip">(Tip: podés cambiar tu voto)</div>
        <div id="hostname">Atendido por el contenedor <b>{{ hostname }}</b></div>
        <div id="stack">
          Voto -&gt; <b>Redis</b> -&gt; <b>worker Python</b> -&gt; <b>PostgreSQL</b> -&gt; <b>resultados (Node.js)</b>
        </div>
      </div>
    </div>

    <script>
      // Marcamos visualmente la opción votada (no hace falta jquery).
      var vote = "{{ vote }}";
      if (vote === "a") {
        document.querySelector(".a").classList.add("voted");
        document.querySelector(".b").classList.add("dimmed");
      }
      if (vote === "b") {
        document.querySelector(".b").classList.add("voted");
        document.querySelector(".a").classList.add("dimmed");
      }
    </script>
  </body>
</html>
